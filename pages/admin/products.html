<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Product Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold mb-6 text-green-700">Product Management</h1>

    <!-- Filters -->
    <div class="flex flex-wrap gap-3 mb-6 items-center">
      <input id="searchInput" type="text" placeholder="🔍 Search by name..."
        class="border rounded-lg px-3 py-2 w-64 focus:ring-2 focus:ring-green-400">

      <select id="categoryFilter" class="border rounded-lg px-3 py-2">
        <option value="">All categories</option>
      </select>

      <select id="subcategoryFilter" class="border rounded-lg px-3 py-2">
        <option value="">All subcategories</option>
      </select>

      <button id="addProductBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition">
        ➕ Add product
      </button>
    </div>

    <!-- Products Table -->
    <div class="overflow-x-auto bg-white rounded-lg shadow">
      <table class="min-w-full text-sm text-left border-collapse">
        <thead class="bg-green-600 text-white">
          <tr>
            <th class="px-4 py-3">ID</th>
            <th class="px-4 py-3">Image</th>
            <th class="px-4 py-3">Name</th>
            <th class="px-4 py-3">Price</th>
            <th class="px-4 py-3">Category</th>
            <th class="px-4 py-3">Subcategory</th>
            <th class="px-4 py-3">Actions</th>
          </tr>
        </thead>
        <tbody id="productsTable" class="divide-y"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal (Add/Edit Product) -->
  <div id="productModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
    <div class="bg-white rounded-lg p-6 w-[500px] relative shadow-lg">
      <h2 id="modalTitle" class="text-xl font-semibold mb-4 text-green-700">Add product</h2>
      <form id="productForm" class="space-y-3">
        <input type="hidden" id="productId" />
        <input id="nameLatin" class="w-full border rounded px-3 py-2" placeholder="Latin name" required>
        <input id="nameEn" class="w-full border rounded px-3 py-2" placeholder="English name" required>
        <input id="price" type="number" step="0.01" class="w-full border rounded px-3 py-2" placeholder="Price" required>
        <textarea id="description" class="w-full border rounded px-3 py-2" placeholder="Description"></textarea>
        <select id="category" class="w-full border rounded px-3 py-2"></select>
        <select id="subcategory" class="w-full border rounded px-3 py-2"></select>
        <input id="imagePath" class="w-full border rounded px-3 py-2" placeholder="Image path (ex: img/p1.png)">
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancelBtn" class="px-4 py-2 rounded bg-gray-300 hover:bg-gray-400 transition">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded bg-green-600 text-white hover:bg-green-700 transition">💾 Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = "https://madarom-project-production.up.railway.app/api";
    const productsTable = document.getElementById("productsTable");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const subcategoryFilter = document.getElementById("subcategoryFilter");

    const modal = document.getElementById("productModal");
    const productForm = document.getElementById("productForm");
    const modalTitle = document.getElementById("modalTitle");
    const cancelBtn = document.getElementById("cancelBtn");

    let categories = [];
    let subcategories = [];
    let products = [];

    // Format Price
    function formatPrice(val) {
      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(val);
    }

    async function fetchData() {
      const [pRes, cRes, sRes] = await Promise.all([
        fetch(`${API_BASE}/products/details`),
        fetch(`${API_BASE}/categories`),
        fetch(`${API_BASE}/subcategories`)
      ]);
      products = await pRes.json();
      categories = await cRes.json();
      subcategories = await sRes.json();
      renderFilters();
      renderProducts();
    }

    function renderFilters() {
      categoryFilter.innerHTML = '<option value="">All categories</option>' +
        categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("");

      subcategoryFilter.innerHTML = '<option value="">All subcategories</option>' +
        subcategories.map(s => `<option value="${s.id}">${s.name}</option>`).join("");

      // also fill modal selects
      document.getElementById("category").innerHTML = categoryFilter.innerHTML;
      document.getElementById("subcategory").innerHTML = subcategoryFilter.innerHTML;
    }

    function renderProducts() {
      const search = searchInput.value.toLowerCase();
      const catId = categoryFilter.value;
      const subId = subcategoryFilter.value;

      const filtered = products.filter(p =>
        (!search || p.name_en.toLowerCase().includes(search) || p.name_latin.toLowerCase().includes(search)) &&
        (!catId || p.category_id == catId) &&
        (!subId || p.subcategory_id == subId)
      );

      productsTable.innerHTML = filtered.map(p => `
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-2">${p.id}</td>
          <td class="px-4 py-2">
            <img src="https://www.madarom.net/assets/${p.image_path ?? 'assets/img/products/PE002.png'}" class="w-12 h-12 object-cover rounded">
          </td>
          <td class="px-4 py-2">
            <div class="font-medium">${p.name_latin}</div>
            <div class="text-gray-500 text-xs">${p.name_en}</div>
          </td>
          <td class="px-4 py-2">${formatPrice(p.active_price?.amount ?? 0)}</td>
          <td class="px-4 py-2">${categories.find(c => c.id == p.category_id)?.name ?? '-'}</td>
          <td class="px-4 py-2">${subcategories.find(s => s.id == p.subcategory_id)?.name ?? '-'}</td>
          <td class="px-4 py-2 flex gap-2">
            <button onclick="editProduct(${p.id})" class="text-blue-600 hover:underline">Edit</button>
            <button onclick="deleteProduct(${p.id})" class="text-red-600 hover:underline">Delete</button>
          </td>
        </tr>
      `).join("");
    }

    // --- CRUD logic ---
    document.getElementById("addProductBtn").onclick = () => openModal();
    cancelBtn.onclick = () => closeModal();

    function openModal(product = null) {
      modal.classList.remove("hidden");
      if (product) {
        modalTitle.textContent = "Edit product";
        document.getElementById("productId").value = product.id;
        document.getElementById("nameLatin").value = product.name_latin;
        document.getElementById("nameEn").value = product.name_en;
        document.getElementById("price").value = product.active_price?.amount ?? "";
        document.getElementById("description").value = product.description_en ?? "";
        document.getElementById("category").value = product.category_id ?? "";
        document.getElementById("subcategory").value = product.subcategory_id ?? "";
        document.getElementById("imagePath").value = product.image_path ?? "";
      } else {
        modalTitle.textContent = "Add product";
        productForm.reset();
        document.getElementById("productId").value = "";
      }
    }

    function closeModal() {
      modal.classList.add("hidden");
    }

    productForm.onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById("productId").value;
      const data = {
        name_latin: document.getElementById("nameLatin").value,
        name_en: document.getElementById("nameEn").value,
        active_price: { amount: parseFloat(document.getElementById("price").value) },
        description_en: document.getElementById("description").value,
        category_id: document.getElementById("category").value,
        subcategory_id: document.getElementById("subcategory").value,
        image_path: document.getElementById("imagePath").value,
      };
      const method = id ? "PUT" : "POST";
      const url = id ? `${API_BASE}/products/${id}` : `${API_BASE}/products`;

      await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      closeModal();
      fetchData();
    };

    async function editProduct(id) {
      const product = products.find(p => p.id == id);
      openModal(product);
    }

    async function deleteProduct(id) {
      if (confirm("Delete this product?")) {
        await fetch(`${API_BASE}/products/${id}`, { method: "DELETE" });
        fetchData();
      }
    }

    searchInput.oninput = renderProducts;
    categoryFilter.onchange = renderProducts;
    subcategoryFilter.onchange = renderProducts;

    fetchData();
  </script>
</body>
</html>
