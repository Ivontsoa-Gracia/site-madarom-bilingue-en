<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="bg-gray-100 p-6">

  <div class="flex flex-wrap gap-4 mb-6">
    <input type="date" id="filterDate" class="px-4 py-2 border rounded" placeholder="Filter by date">
    <select id="statusFilter" class="px-4 py-2 border rounded">
      <option value="">All Status</option>
    </select>
    <select id="sortOrder" class="px-4 py-2 border rounded">
      <option value="asc">Sort Ascending</option>
      <option value="desc">Sort Descending</option>
    </select>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6"></div>

</body>
</html>
