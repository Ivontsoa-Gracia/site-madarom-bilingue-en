<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders</title>
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Boxicons -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="bg-gray-100 p-6">

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <!-- Exemple de carte -->
    <div class="relative bg-white p-5 rounded-xl shadow-md">
      <!-- Badge -->
      <span class="absolute top-3 right-3 text-xs font-semibold px-3 py-1 rounded-full bg-yellow-500 text-white">
        Pending
      </span>
      <h2 class="text-lg font-semibold text-gray-800">ORD-20250825</h2>
      <p class="flex items-center text-gray-600 mt-2 text-sm">
        <i class="bx bx-calendar mr-2 text-lg"></i> 2025-08-25
      </p>
      <p class="flex items-center text-gray-600 mt-1 text-sm">
        <i class="bx bx-user mr-2 text-lg"></i> Jean Pierre
      </p>
      <h3 class="text-xl font-bold text-gray-900 mt-3">$22.000</h3>
      <button class=" mt-4 flex items-center justify-center gap-2 btn-primary text-white text-sm font-medium px-4 py-2 rounded-full transition w-full">
        <i class="bx bx-show"></i> View details
      </button>  
    </div>

    <div class="relative bg-white p-5 rounded-xl shadow-md">
      <span class="absolute top-3 right-3 text-xs font-semibold px-3 py-1 rounded-full bg-green-600 text-white">
        Validated
      </span>
      <h2 class="text-lg font-semibold text-gray-800">ORD-20250826</h2>
      <p class="flex items-center text-gray-600 mt-2 text-sm">
        <i class="bx bx-calendar mr-2 text-lg"></i> 2025-08-26
      </p>
      <p class="flex items-center text-gray-600 mt-1 text-sm">
        <i class="bx bx-user mr-2 text-lg"></i> Marie Claire
      </p>
      <h3 class="text-xl font-bold text-gray-900 mt-3">$150.000</h3>
      <button class=" mt-4 flex items-center justify-center gap-2 btn-primary text-white text-sm font-medium px-4 py-2 rounded-full transition w-full">
        <i class="bx bx-show"></i> View details
      </button>  
    </div>

    <div class="relative bg-white p-5 rounded-xl shadow-md">
      <span class="absolute top-3 right-3 text-xs font-semibold px-3 py-1 rounded-full bg-blue-600 text-white">
        Command
      </span>
      <h2 class="text-lg font-semibold text-gray-800">ORD-20250827</h2>
      <p class="flex items-center text-gray-600 mt-2 text-sm">
        <i class="bx bx-calendar mr-2 text-lg"></i> 2025-08-27
      </p>
      <p class="flex items-center text-gray-600 mt-1 text-sm">
        <i class="bx bx-user mr-2 text-lg"></i> Paul Martin
      </p>
      <h3 class="text-xl font-bold text-gray-900 mt-3">$75.000</h3>
      <button class=" mt-4 flex items-center justify-center gap-2 btn-primary text-white text-sm font-medium px-4 py-2 rounded-full transition w-full">
        <i class="bx bx-show"></i> View details
      </button>  
    </div>

    <div class="relative bg-white p-5 rounded-xl shadow-md">
      <span class="absolute top-3 right-3 text-xs font-semibold px-3 py-1 rounded-full bg-red-600 text-white">
        Canceled
      </span>
      <h2 class="text-lg font-semibold text-gray-800">ORD-20250828</h2>
      <p class="flex items-center text-gray-600 mt-2 text-sm">
        <i class="bx bx-calendar mr-2 text-lg"></i> 2025-08-28
      </p>
      <p class="flex items-center text-gray-600 mt-1 text-sm">
        <i class="bx bx-user mr-2 text-lg"></i> Alice Dupont
      </p>
      <h3 class="text-xl font-bold text-gray-900 mt-3">$300.000</h3>
      <button class=" mt-4 flex items-center justify-center gap-2 btn-primary text-white text-sm font-medium px-4 py-2 rounded-full transition w-full">
        <i class="bx bx-show"></i> View details
      </button>      
    </div>
  </div>

  <script>
        let allOrders = [];

        const tbody = document.getElementById('quotesBody');
        const filterDate = document.getElementById('filterDate');
        const sortOrder = document.getElementById('sortOrder');
        const statusFilter = document.getElementById('statusFilter');

        const renderStatusBadge = (status) => {
        const base = "px-2 py-1 rounded-full text-xs font-medium";
        switch (status) {
            case "validated":
            return `<span class="${base} bg-success/10 text-success">Validated</span>`;
            case "pending":
            return `<span class="${base} bg-warning/10 text-yellow-800">Pending</span>`;
            case "refused":
            return `<span class="${base} bg-danger/10 text-danger">Refused</span>`;
            default:
            return `<span class="${base} bg-gray-200 text-gray-600">${status}</span>`;
        }
        }

        const container = document.querySelector('.grid');

        const renderCards = (data) => {
            container.innerHTML = '';
            data.quote.forEach(order => {
                const badgeColor = {
                    pending: 'bg-yellow-500',
                    validated: 'bg-green-600',
                    command: 'bg-blue-600',
                    canceled: 'bg-red-600'
                }[order.status.toLowerCase()] || 'bg-gray-400';

                container.innerHTML += `
                    <div class="relative bg-white p-5 rounded-xl shadow-md">
                        <span class="absolute top-3 right-3 text-xs font-semibold px-3 py-1 rounded-full text-white ${badgeColor}">
                        ${order.status}
                        </span>
                        <h2 class="text-lg font-semibold text-gray-800">${order.reference}</h2>
                        <p class="flex items-center text-gray-600 mt-2 text-sm">
                        <i class="bx bx-calendar mr-2 text-lg"></i> ${order.updated_at?.split('T')[0]}
                        </p>
                        <p class="flex items-center text-gray-600 mt-1 text-sm">
                        <i class="bx bx-user mr-2 text-lg"></i> ${order.client_name}
                        </p>
                        <h3 class="text-xl font-bold text-gray-900 mt-3">$${order.total}</h3>
                        <button class="mt-4 flex items-center justify-center gap-2 btn-primary text-white text-sm font-medium px-4 py-2 rounded-full w-full">
                        <i class="bx bx-show"></i> View details
                        </button>
                    </div>
                `;
            });
        }

        const applyFilters = () => {
        let filtered = [...allOrders];
        const dateVal = filterDate.value;
        const sort = sortOrder.value;
        const statusVal = statusFilter.value;

        if (dateVal) filtered = filtered.filter(q => q.created_at.startsWith(dateVal));
        if (statusVal) filtered = filtered.filter(q => q.status === statusVal);

        filtered.sort((a, b) => {
            const dA = new Date(a.created_at);
            const dB = new Date(b.created_at);
            return sort === 'desc' ? dB - dA : dA - dB;
        });

        renderOrders(filtered);
        }

        async function fetchQuotes() {
        const token = localStorage.getItem("token");
        if (!token) {
            alert("No token found. Please log in.");
            return;
        }

        try {
            const res = await fetch("http://127.0.0.1:8000/api/quote", {
            method: "GET",
            headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            }
            });

            if (!res.ok) {
            const errorData = await res.json().catch(() => ({}));
            const message = errorData.message || errorData.error || "Fetch failed";
            throw new Error(message);
            }

            const data = await res.json();
            console.log("Les devis:", data);

            allOrders = data.filter(quote => quote.status?.toLowerCase() === "validated");

            applyFilters();
        } catch (err) {
            console.error("Error fetching quotes:", err);
            alert(`Error fetching quotes: ${err.message}`);
        }
        }

        function viewQuote(id) {
        if (!id) return;
        window.location.href = `/admin/show?ref=${encodeURIComponent(id)}`;
        }

        filterDate.addEventListener('input', applyFilters);
        sortOrder.addEventListener('change', applyFilters);
        statusFilter.addEventListener('change', applyFilters);

        fetchQuotes();
  </script>

</body>
</html>
