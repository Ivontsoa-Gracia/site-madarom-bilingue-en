<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="flex">

  <div id="sidebar-placeholder"></div>

  <main class="ml-64 w-full min-h-screen bg-gray-50">
    <div id="main-content" class="p-6">
      <h1 class="text-2xl font-bold mb-4 text-gray-800">Welcome, Admin!</h1>
      <p class="text-gray-600">Select an item from the sidebar to get started.</p>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch("sidebar.html")
        .then(response => response.text())
        .then(html => {
          document.getElementById("sidebar-placeholder").innerHTML = html;
    
          const links = document.querySelectorAll(".menu-link");
          const content = document.getElementById("main-content");
    
          links.forEach(link => {
            link.addEventListener("click", e => {
              e.preventDefault();
    
              const page = link.dataset.page;       // le HTML à charger
              const scriptPath = link.dataset.script; // le JS à charger
              const url = link.getAttribute("href");  // /admin/order ou /admin/quote
    
              // style actif du menu
              links.forEach(l => l.classList.remove("bg-[#393E46]"));
              link.classList.add("bg-[#393E46]");
    
              // injecter le contenu
              fetch(page)
                .then(res => res.text())
                .then(html => {
                  content.innerHTML = html;
    
                  // mettre à jour l'URL dans la barre
                  window.history.pushState(null, "", url);
    
                  // Charger dynamiquement le script
                  if (scriptPath) {
                    const oldScript = document.querySelector(`script[src="${scriptPath}"]`);
                    if (oldScript) oldScript.remove(); // éviter doublons
    
                    const script = document.createElement("script");
                    script.src = scriptPath;
                    script.defer = true;
                    document.body.appendChild(script);
                  }
                });
            });
          });
        });
    });
    
    // Gestion bouton retour navigateur
    window.addEventListener("popstate", () => {
      const currentPath = window.location.pathname;
      const link = document.querySelector(`.menu-link[href="${currentPath}"]`);
      if (link) link.click();
    });
    </script>
    
</body>
</html>
