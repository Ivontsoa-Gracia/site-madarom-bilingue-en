<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="flex">

  <div id="sidebar-placeholder"></div>

  <main class="ml-64 w-full min-h-screen bg-gray-50">
    <div id="main-content" class="p-6">
      <h1 class="text-2xl font-bold mb-4 text-gray-800">Welcome, Admin!</h1>
      <p class="text-gray-600">Select an item from the sidebar to get started.</p>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch("sidebar.html")
        .then(res => res.text())
        .then(html => {
          document.getElementById("sidebar-placeholder").innerHTML = html;

          const links = document.querySelectorAll(".menu-link");
          const content = document.getElementById("main-content");

          links.forEach(link => {
            link.addEventListener("click", e => {
              e.preventDefault();

              const htmlPage = link.dataset.page; // prend le vrai fichier à fetch
              const url = link.getAttribute("href"); // garde /admin/quote pour l’URL

              links.forEach(l => l.classList.remove("bg-[#393E46]"));
              link.classList.add("bg-[#393E46]");

              // Injection du contenu
              fetch(htmlPage)
                .then(res => res.text())
                .then(html => {
                  content.innerHTML = html;

                  // Modifier l'URL sans recharger la page
                  window.history.pushState(null, "", url);

                  // Charger le script correspondant
                  switch (url) {
                    case '/admin/order':
                      const orderScript = document.createElement('script');
                      orderScript.src = '../../assets/js/admin/order.js';
                      document.body.appendChild(orderScript);
                      break;

                    case '/admin/quote':
                      const quoteScript = document.createElement('script');
                      quoteScript.src = '../../assets/js/admin/quote.js';
                      document.body.appendChild(quoteScript);
                      break;
                  }
                });
            });
          });
        });
    });

    // Gérer le back/forward du navigateur
    window.addEventListener("popstate", () => {
      const currentPath = window.location.pathname;
      const link = document.querySelector(`.menu-link[href="${currentPath}"]`);
      if (link) link.click();
    });

  </script>
  
</body>
</html>
