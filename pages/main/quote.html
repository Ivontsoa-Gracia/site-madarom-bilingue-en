<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Quotes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="bg-gray-100 text-gray-800 p-6">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-3xl font-bold text-teal-700 mb-6">My Quotes</h1>

    <div class="bg-white p-6 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row gap-6 md:gap-10">
      <!-- Filter by Date -->
      <div class="flex flex-col">
        <label class="text-sm font-medium text-gray-600 mb-2">Filter by Date</label>
        <input 
          type="date" 
          id="filterDate" 
          class="px-3 py-2 rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none transition w-full" 
        />
      </div>
    
      <!-- Sort by Date -->
      <div class="flex flex-col">
        <label class="text-sm font-medium text-gray-600 mb-2">Sort by Date</label>
        <select 
          id="sortOrder" 
          class="px-3 py-2 rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none transition w-full"
        >
          <option value="desc">Most Recent</option>
          <option value="asc">Oldest</option>
        </select>
      </div>
    </div>
    

    <div class="overflow-x-auto bg-white rounded-lg shadow">
      <table class="min-w-full divide-y divide-gray-200">
        <tbody id="quotesBody" class="divide-y divide-gray-100">
        </tbody>
      </table>
    </div>
  </div>

  <script src="../../assets/js/quote.js"></script>
</body>
</html>
