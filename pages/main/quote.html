<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Quotes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="bg-gray-100 text-gray-800 p-6">
  <div class="max-w-6xl mx-auto"> 
    <h1 class="text-3xl font-bold text-black mb-6">My Quotes</h1>
  
    <div class="bg-white border border-black p-6 rounded-lg shadow mb-6 flex flex-col md:flex-row gap-6">
  
      <!-- Filtrer par date -->
      <div>
        <label class="block font-semibold text-sm mb-2 text-black">Filter by Date:</label>
        <input type="date" id="filterDate" 
          class="border border-black rounded px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-black bg-white text-black"/>
      </div>
  
      <!-- Trier par date -->
      <div>
        <label class="block font-semibold text-sm mb-2 text-black">Sort by Date:</label>
        <div class="flex gap-2">
          <button id="sortDesc" 
            class="px-4 py-2 border border-black rounded bg-black text-white hover:bg-gray-800">
            Most Recent
          </button>
          <button id="sortAsc" 
            class="px-4 py-2 border border-black rounded bg-white text-black hover:bg-gray-100">
            Oldest
          </button>
        </div>
      </div>
      
    </div>
  </div>
  

    <div class="overflow-x-auto bg-white rounded-lg shadow">
      <table class="min-w-full divide-y divide-gray-200">
        <tbody id="quotesBody" class="divide-y divide-gray-100">
        </tbody>
      </table>
    </div>
  </div>

  <script src="../../assets/js/quote.js"></script>
</body>
</html>
