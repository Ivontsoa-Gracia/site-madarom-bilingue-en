<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Payment Proof</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">

  <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-md">
    <h2 class="text-2xl font-semibold mb-6 text-gray-800 text-center">Submit Your Payment</h2>

    <form id="paymentForm" class="flex flex-col gap-4">
      <input type="hidden" name="quote_id" id="quote_id">

      <input type="text" name="phone_number" id="phone_number" placeholder="Phone Number" required
             class="border border-gray-300 rounded-md p-3 focus:outline-none focus:ring-2 focus:ring-green-500">

      <input type="text" name="city" id="city" placeholder="City" required
             class="border border-gray-300 rounded-md p-3 focus:outline-none focus:ring-2 focus:ring-green-500">

      <input type="text" name="country" id="country" placeholder="Country" required
             class="border border-gray-300 rounded-md p-3 focus:outline-none focus:ring-2 focus:ring-green-500">

      <input type="file" name="screenshot" id="screenshot" accept="image/*" required
             class="border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-green-500">

      <div id="preview" class="mt-4 text-center"></div>

      <button type="submit"
              class="btn-primary text-white font-semibold py-3 rounded-full transition">
        Submit Payment
      </button>
    </form>

  </div>

<script>
  const form = document.getElementById("paymentForm");
  const quote_id = document.getElementById("quote_id");
  const phone_number = document.getElementById("phone_number");
  const city = document.getElementById("city");
  const country = document.getElementById("country");
  const screenshot = document.getElementById("screenshot");
  const preview = document.getElementById("preview");

  const token = localStorage.getItem("token");

  async function fileToBase64(file) {
      return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => resolve(reader.result.split(',')[1]); // retire "data:image/...;base64,"
          reader.onerror = error => reject(error);
      });
  }

  screenshot.addEventListener("change", async () => {
      if (screenshot.files && screenshot.files[0]) {
          const reader = new FileReader();
          reader.onload = e => {
              preview.innerHTML = `<img src="${e.target.result}" class="mx-auto max-w-xs rounded-md shadow-md"/>`;
          };
          reader.readAsDataURL(screenshot.files[0]);
      } else {
          preview.innerHTML = "";
      }
  });

  form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!token) {
          alert("No token found. Please login first.");
          return;
      }

      const btn = form.querySelector("button[type=submit]");
      btn.disabled = true;
      btn.innerHTML = "Submitting...";

      try {
          const screenshotBase64 = await fileToBase64(screenshot.files[0]);

          const payload = {
              quote_id: quote_id.value,
              phone_number: phone_number.value,
              city: city.value,
              country: country.value,
              screenshot: screenshotBase64
          };

          const response = await fetch("http://127.0.0.1:8000/api/quote/payment", {
              method: "POST",
              headers: {
                  "Authorization": `Bearer ${token}`,
                  "Content-Type": "application/json"
              },
              body: JSON.stringify(payload)
          });

          if (response.ok) {
              const data = await response.json();
              alert(data.message);
          } else {
              const error = await response.json();
              console.error(error);
              alert(error.message || "Une erreur est survenue.");
          }
      } catch (err) {
          console.error(err);
          alert("Une erreur est survenue lors de la soumission.");
      } finally {
          btn.disabled = false;
          btn.innerHTML = "Submit Payment";
      }
  });

  // Load quote data from URL param
  async function loadQuoteData(id) {
      try {
          const res = await fetch(`http://127.0.0.1:8000/api/quote/${id}`, {
              headers: {
                  "Authorization": `Bearer ${token}`,
                  "Content-Type": "application/json"
              }
          });
          if (!res.ok) throw new Error("Devis non trouvé");
          const quote = await res.json();
          quote_id.value = quote.id || quote.quote?.id; 
      } catch (err) {
          console.error(err);
          alert("Impossible de charger le devis.");
      }
  }

  const params = new URLSearchParams(window.location.search);
  const ref = params.get("ref");
  if (ref) {
      loadQuoteData(ref);
  } else {
      alert("Aucun ID de devis fourni.");
  }
</script>

</body>
</html>
